[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:postgres]
command=/usr/local/bin/run-postgres.sh
user=postgres
autorestart=true
startsecs=5
stopsignal=INT

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379
autorestart=true
startsecs=2

[program:web]
command=/usr/local/bin/run-web.sh
directory=/app/backend
autorestart=true
startsecs=5
environment=PYTHONUNBUFFERED="1"

[program:celery-worker]
command=celery -A payouts worker --loglevel info
directory=/app/backend
autorestart=true
startsecs=5
environment=PYTHONUNBUFFERED="1"

[program:celery-beat]
command=celery -A payouts beat --loglevel info
directory=/app/backend
autorestart=true
startsecs=5
environment=PYTHONUNBUFFERED="1"

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startsecs=2