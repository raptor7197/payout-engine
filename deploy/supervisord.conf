[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:postgres]
command=/usr/local/bin/run-postgres.sh
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=NONE
redirect_stderr=true

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --maxmemory 64mb --maxmemory-policy allkeys-lru
autorestart=true
startsecs=2
stdout_logfile=NONE
redirect_stderr=true

[program:web]
command=/usr/local/bin/run-web.sh
directory=/app/backend
autorestart=true
startsecs=5
environment=PYTHONUNBUFFERED="1"
stdout_logfile=NONE
redirect_stderr=true

[program:celery-worker]
command=celery -A payouts worker --loglevel info --concurrency=1
directory=/app/backend
autorestart=true
startsecs=5
environment=PYTHONUNBUFFERED="1"
stdout_logfile=NONE
redirect_stderr=true

[program:celery-beat]
command=celery -A payouts beat --loglevel info
directory=/app/backend
autorestart=true
startsecs=5
environment=PYTHONUNBUFFERED="1"
stdout_logfile=NONE
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startsecs=2
stdout_logfile=NONE
redirect_stderr=true